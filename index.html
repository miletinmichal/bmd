<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>BMD Models – View in AR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Load model-viewer only for non-iOS (hybrid for stability) -->
  <script>
    (function () {
      const ua = navigator.userAgent || navigator.vendor || window.opera;
      const isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      if (!isIOS) {
        const s = document.createElement('script');
        s.type = 'module';
        s.src = 'https://unpkg.com/@google/model-viewer@3.4.0/dist/model-viewer.min.js';
        document.head.appendChild(s);
      } else {
        document.documentElement.classList.add('ios');
      }
    })();
  </script>

  <style>
    :root{
      --gap: clamp(12px, 2vw, 24px);
      --radius: 14px;
      --card-min: min(30rem, 95vw);
      --shadow: 0 2px 12px rgba(0,0,0,.08);
      --text: #0b0f1a;
      --muted: #5a6472;
      --bg: #f6f7f9;
      --accent: #0a66ff;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, "Helvetica Neue", Arial, sans-serif;
      color:var(--text);
      background:var(--bg);
    }
    header{
      position:sticky; top:0; z-index:2;
      background:#fff;
      padding: clamp(12px, 2.5vw, 20px) var(--gap);
      text-align:center;
      box-shadow: 0 1px 0 rgba(0,0,0,.04);
    }
    h1{ margin:0; font-size: clamp(1.1rem, 2.2vw, 1.8rem); font-weight:700; }

    .wrap{ margin:0 auto; max-width:1600px; padding:var(--gap); }
    .grid{
      display:grid;
      grid-template-columns: repeat(auto-fit, minmax(var(--card-min), 1fr));
      gap:var(--gap);
      align-items:stretch;
    }

    .card{
      position:relative;
      display:flex; flex-direction:column; gap:12px;
      background:#fff; border-radius:var(--radius); box-shadow:var(--shadow);
      padding: clamp(12px, 2vw, 18px);
    }
    .title{
      text-align:center; margin:0; font-weight:600; color:var(--muted);
      font-size: clamp(1rem, 1.6vw, 1.25rem);
    }

    /* MEDIA — keep poster aspect ratio (no cropping) */
    .media{ display:block; }
    .poster{
      display:block; width:100%; height:auto; object-fit:contain;
      border-radius:10px; background:#fff;
    }
    model-viewer{
      width:100%; height:auto; display:block;
      --poster-color:#fff; border-radius:10px;
    }

    /* Actions */
    .actions{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:6px; }
    .arbtn{
      cursor:pointer; border:none; border-radius:12px;
      padding: clamp(10px, 1.4vw, 12px) clamp(14px, 2vw, 18px);
      font-size: clamp(0.95rem, 1.3vw, 1rem);
      background:var(--accent); color:#fff; text-decoration:none;
      box-shadow:0 2px 8px rgba(10,102,255,.25);
      display:inline-flex; align-items:center; justify-content:center;
    }
    .ghost{ background:#eef3ff; color:#113274; }

    /* Platform logic */
    .mv { display:block; }
    .iosonly { display:none; }
    .ios .mv { display:none; }
    .ios .iosonly { display:block; }

    /* Corner AR badge (one-tap AR) */
    .ar-badge{
      position:absolute; top:10px; right:10px; z-index:1;
      display:inline-flex; align-items:center; justify-content:center;
      width:40px; height:40px; border-radius:10px;
      background:rgba(10,102,255,.95); color:#fff; text-decoration:none;
      box-shadow:0 2px 8px rgba(0,0,0,.18);
      font-weight:700; font-size:14px;
    }
    .ar-badge span{ transform: translateY(-1px); }
    @media (hover:hover){
      .ar-badge:hover{ filter:brightness(1.06); }
    }

    @media (prefers-reduced-motion: reduce){
      model-viewer{ --auto-rotate: 0 }
    }
  </style>
</head>

<body>
  <header><h1>Tap a model to view in AR</h1></header>

  <main class="wrap">
    <section class="grid">

      <!-- iOS SAFE: BMD 3 -->
      <article class="card iosonly" data-glb="bmd3.glb" data-usdz="bmd3.usdz" data-title="BMD 3">
        <a class="ar-badge arlink" aria-label="Open in AR"><span>AR</span></a>
        <h2 class="title">BMD 3</h2>
        <div class="media"><img class="poster" src="ICONS/BMD3_A.webp" alt="BMD 3 preview"></div>
        <div class="actions">
          <a class="arbtn arlink">View in AR</a>
        </div>
      </article>

      <!-- NON-iOS: BMD 3 -->
      <article class="card mv" data-glb="bmd3.glb" data-usdz="bmd3.usdz" data-title="BMD 3">
        <a class="ar-badge arlink" aria-label="Open in AR"><span>AR</span></a>
        <h2 class="title">BMD 3</h2>
        <div class="media">
          <model-viewer
            src="bmd3.glb"
            ios-src="bmd3.usdz"
            alt="BMD 3 Presetting Machine"
            ar
            ar-modes="webxr scene-viewer quick-look"
            camera-controls
            auto-rotate
            loading="lazy"
            reveal="interaction">
            <img slot="poster" class="poster" src="ICONS/BMD3_A.webp" alt="BMD 3 preview">
            <button class="arbtn" slot="ar-button">View in AR</button>
          </model-viewer>
        </div>
        <div class="actions">
          <a class="arbtn ghost" href="viewer-3d-bmd3.html" target="_blank" rel="noopener">Open 3D (no AR)</a>
        </div>
      </article>

      <!-- iOS SAFE: BMD 5 -->
      <article class="card iosonly" data-glb="bmd5.glb" data-usdz="bmd5.usdz" data-title="BMD 5">
        <a class="ar-badge arlink" aria-label="Open in AR"><span>AR</span></a>
        <h2 class="title">BMD 5</h2>
        <div class="media"><img class="poster" src="ICONS/BMD5_A.webp" alt="BMD 5 preview"></div>
        <div class="actions">
          <a class="arbtn arlink">View in AR</a>
        </div>
      </article>

      <!-- NON-iOS: BMD 5 -->
      <article class="card mv" data-glb="bmd5.glb" data-usdz="bmd5.usdz" data-title="BMD 5">
        <a class="ar-badge arlink" aria-label="Open in AR"><span>AR</span></a>
        <h2 class="title">BMD 5</h2>
        <div class="media">
          <model-viewer
            src="bmd5.glb"
            ios-src="bmd5.usdz"
            alt="BMD 5 Presetting Machine"
            ar
            ar-modes="webxr scene-viewer quick-look"
            camera-controls
            auto-rotate
            loading="lazy"
            reveal="interaction">
            <img slot="poster" class="poster" src="ICONS/BMD5_A.webp" alt="BMD 5 preview">
            <button class="arbtn" slot="ar-button">View in AR</button>
          </model-viewer>
        </div>
        <div class="actions">
          <a class="arbtn ghost" href="viewer-3d-bmd5.html" target="_blank" rel="noopener">Open 3D (no AR)</a>
        </div>
      </article>

      <!-- iOS SAFE: reBMD -->
      <article class="card iosonly" data-glb="rebmd.glb" data-usdz="rebmd.usdz" data-title="reBMD">
        <a class="ar-badge arlink" aria-label="Open in AR"><span>AR</span></a>
        <h2 class="title">reBMD</h2>
        <div class="media"><img class="poster" src="ICONS/REBMD_A.webp" alt="reBMD preview"></div>
        <div class="actions">
          <a class="arbtn arlink">View in AR</a>
        </div>
      </article>

      <!-- NON-iOS: reBMD -->
      <article class="card mv" data-glb="rebmd.glb" data-usdz="rebmd.usdz" data-title="reBMD">
        <a class="ar-badge arlink" aria-label="Open in AR"><span>AR</span></a>
        <h2 class="title">reBMD</h2>
        <div class="media">
          <model-viewer
            src="rebmd.glb"
            ios-src="rebmd.usdz"
            alt="reBMD Presetting Machine"
            ar
            ar-modes="webxr scene-viewer quick-look"
            camera-controls
            auto-rotate
            loading="lazy"
            reveal="interaction">
            <img slot="poster" class="poster" src="ICONS/REBMD_A.webp" alt="reBMD preview">
            <button class="arbtn" slot="ar-button">View in AR</button>
          </model-viewer>
        </div>
        <div class="actions">
          <a class="arbtn ghost" href="viewer-3d-rebmd.html" target="_blank" rel="noopener">Open 3D (no AR)</a>
        </div>
      </article>

    </section>
  </main>

  <!-- One-tap AR links: iOS opens USDZ directly; Android opens Scene Viewer -->
  <script>
    // Build absolute URL for a relative asset
    function abs(url){ return new URL(url, window.location.href).href; }

    const ua = navigator.userAgent || navigator.vendor || window.opera;
    const isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    const isAndroid = /Android/i.test(ua);

    document.querySelectorAll('.card').forEach(card=>{
      const glb = card.dataset.glb;
      const usdz = card.dataset.usdz;
      const title = encodeURIComponent(card.dataset.title || 'Model');

      // Determine AR target URL for this platform
      let arURL = '#';
      let rel = null;

      if (isIOS && usdz){
        // Quick Look: direct USDZ
        arURL = abs(usdz);
        rel = 'ar';
      } else if (isAndroid && glb){
        // Scene Viewer: GLB, AR preferred
        arURL = `https://arvr.google.com/scene-viewer/1.0?file=${encodeURIComponent(abs(glb))}&mode=ar_preferred&title=${title}`;
      } else if (glb){
        // Desktop fallback: just open GLB (download/viewer)
        arURL = abs(glb);
      }

      // Wire all .arlink elements in this card
      card.querySelectorAll('.arlink').forEach(a=>{
        a.setAttribute('href', arURL);
        if (rel){ a.setAttribute('rel', rel); }
        a.setAttribute('target', isAndroid ? '_self' : '_self'); // keep in same tab
      });
    });
  </script>
</body>
</html>
