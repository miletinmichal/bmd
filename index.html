<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>BMD Models – View in AR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Load model-viewer only for non-iOS (hybrid for stability) -->
  <script>
    (function () {
      const ua = navigator.userAgent || navigator.vendor || window.opera;
      const isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      if (!isIOS) {
        const s = document.createElement('script');
        s.type = 'module';
        s.src = 'https://unpkg.com/@google/model-viewer@3.4.0/dist/model-viewer.min.js';
        document.head.appendChild(s);
      } else {
        document.documentElement.classList.add('ios');
      }
    })();
  </script>

  <style>
    :root{
      --gap: clamp(12px, 2vw, 24px);
      --radius: 14px;
      --card-min: min(32rem, 95vw); /* lets cards grow on desktop, shrink on phones */
      --shadow: 0 2px 12px rgba(0,0,0,.08);
      --text: #0b0f1a;
      --muted: #5a6472;
      --bg: #f6f7f9;
      --accent: #0a66ff;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, "Helvetica Neue", Arial, sans-serif;
      color:var(--text);
      background:var(--bg);
    }
    header{
      position:sticky; top:0; z-index:2;
      background:linear-gradient(#fff, #fff0);
      padding: clamp(12px, 2.5vw, 20px) var(--gap);
      text-align:center;
      backdrop-filter:saturate(1.2) blur(6px);
    }
    h1{
      margin:0;
      font-size: clamp(1.1rem, 2.2vw, 1.8rem);
      font-weight: 700;
    }

    /* Responsive grid that scales with window size */
    .wrap{
      margin: 0 auto;
      max-width: 1600px;
      padding: var(--gap);
    }
    .grid{
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(var(--card-min), 1fr));
      gap: var(--gap);
      align-items: stretch;
    }

    /* Card layout scales; keeps consistent height without hard-coding */
    .card{
      display:flex; flex-direction:column; justify-content:space-between;
      min-height: clamp(260px, 32vw, 420px);
      background:#fff; border-radius: var(--radius); box-shadow: var(--shadow);
      padding: clamp(12px, 2vw, 18px);
    }
    .title{
      text-align:center;
      font-size: clamp(1rem, 1.6vw, 1.25rem);
      margin: 0 0 8px 0;
      color: var(--muted);
      font-weight:600;
    }

    /* Media area: posters or <model-viewer> fill width and keep aspect */
    .media{
      border-radius: 10px;
      background: #fff;
      display:grid; place-items:center;
      overflow: hidden;
      aspect-ratio: 16 / 9;   /* keeps a stable tile shape but scales with width */
      margin-bottom: clamp(10px, 1.5vw, 14px);
    }
    .poster{
      width: 100%;
      height: 100%;
      object-fit: contain;     /* no cropping; scales nicely */
      display:block;
    }
    model-viewer{
      width:100%; height:100%; display:block;
      --poster-color: #fff;
      border-radius: 10px;
    }

    /* Buttons scale with viewport */
    .actions{
      display:flex; gap: 10px; justify-content:center; flex-wrap:wrap;
    }
    .arbtn{
      cursor:pointer;
      border:none;
      border-radius: 12px;
      padding: clamp(10px, 1.4vw, 12px) clamp(14px, 2vw, 18px);
      font-size: clamp(0.95rem, 1.3vw, 1rem);
      background: var(--accent);
      color:#fff;
      box-shadow: 0 2px 8px rgba(10,102,255,.25);
    }
    .ghost{
      background:#eef3ff; color:#113274;
    }

    /* iOS stability: hide model-viewer cards, show rel="ar" cards */
    .mv { display:block; }
    .iosonly { display:none; }
    .ios .mv { display:none; }
    .ios .iosonly { display:block; }

    @media (prefers-reduced-motion: reduce){
      model-viewer{ --auto-rotate: 0 }
    }
  </style>
</head>

<body>
  <header><h1>Tap a model to view in AR</h1></header>

  <main class="wrap">
    <section class="grid">

      <!-- iOS-safe card -->
      <article class="card iosonly">
        <h2 class="title">BMD 3</h2>
        <div class="media">
          <img class="poster" src="ICONS/BMD3_A.webp" alt="BMD 3 preview">
        </div>
        <div class="actions">
          <a class="arbtn" rel="ar" href="bmd3.usdz">View in AR (iPhone/iPad)</a>
        </div>
      </article>

      <!-- Android/Desktop card -->
      <article class="card mv">
        <h2 class="title">BMD 3</h2>
        <div class="media">
          <model-viewer
            src="bmd3.glb"
            ios-src="bmd3.usdz"
            alt="BMD 3 Presetting Machine"
            ar
            ar-modes="webxr scene-viewer quick-look"
            camera-controls
            auto-rotate
            poster="ICONS/BMD3_A.webp"
            loading="lazy"
            reveal="interaction">
            <button class="arbtn" slot="ar-button">View in AR</button>
          </model-viewer>
        </div>
        <div class="actions">
          <a class="arbtn ghost" href="viewer-3d-bmd3.html" target="_blank" rel="noopener">Open 3D (no AR)</a>
        </div>
      </article>

      <!-- iOS-safe card -->
      <article class="card iosonly">
        <h2 class="title">BMD 5</h2>
        <div class="media">
          <img class="poster" src="ICONS/BMD5_A.webp" alt="BMD 5 preview">
        </div>
        <div class="actions">
          <a class="arbtn" rel="ar" href="bmd5.usdz">View in AR (iPhone/iPad)</a>
        </div>
      </article>

      <!-- Android/Desktop card -->
      <article class="card mv">
        <h2 class="title">BMD 5</h2>
        <div class="media">
          <model-viewer
            src="bmd5.glb"
            ios-src="bmd5.usdz"
            alt="BMD 5 Presetting Machine"
            ar
            ar-modes="webxr scene-viewer quick-look"
            camera-controls
            auto-rotate
            poster="ICONS/BMD5_A.webp"
            loading="lazy"
            reveal="interaction">
            <button class="arbtn" slot="ar-button">View in AR</button>
          </model-viewer>
        </div>
        <div class="actions">
          <a class="arbtn ghost" href="viewer-3d-bmd5.html" target="_blank" rel="noopener">Open 3D (no AR)</a>
        </div>
      </article>

      <!-- iOS-safe card -->
      <article class="card iosonly">
        <h2 class="title">reBMD</h2>
        <div class="media">
          <img class="poster" src="ICONS/REBMD_A.webp" alt="reBMD preview">
        </div>
        <div class="actions">
          <a class="arbtn" rel="ar" href="rebmd.usdz">View in AR (iPhone/iPad)</a>
        </div>
      </article>

      <!-- Android/Desktop card -->
      <article class="card mv">
        <h2 class="title">reBMD</h2>
        <div class="media">
          <model-viewer
            src="rebmd.glb"
            ios-src="rebmd.usdz"
            alt="reBMD Presetting Machine"
            ar
            ar-modes="webxr scene-viewer quick-look"
            camera-controls
            auto-rotate
            poster="ICONS/REBMD_A.webp"
            loading="lazy"
            reveal="interaction">
            <button class="arbtn" slot="ar-button">View in AR</button>
          </model-viewer>
        </div>
        <div class="actions">
          <a class="arbtn ghost" href="viewer-3d-rebmd.html" target="_blank" rel="noopener">Open 3D (no AR)</a>
        </div>
      </article>

    </section>
  </main>
</body>
</html>
