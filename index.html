<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>BMD Models – View in AR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Load model-viewer only if not iOS -->
  <script>
    (function(){
      const ua = navigator.userAgent || navigator.vendor || window.opera;
      const isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      if (!isIOS) {
        const s = document.createElement('script');
        // Pin to a known-stable version rather than "latest"
        s.type = 'module';
        s.src = 'https://unpkg.com/@google/model-viewer@3.4.0/dist/model-viewer.min.js';
        document.head.appendChild(s);
      } else {
        document.documentElement.classList.add('ios');
      }
    })();
  </script>

  <style>
    body { text-align:center; font-family:system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin:20px; background:#fafafa; }
    h1 { margin-bottom: 24px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:28px; align-items:start; }
    .card { background:#fff; border-radius:14px; padding:16px; box-shadow:0 2px 10px rgba(0,0,0,.06); }
    .title { margin:10px 0 12px; font-size:18px; }
    .poster { width:100%; height:auto; border-radius:8px; }
    .arbtn { margin-top:12px; padding:10px 16px; border:none; border-radius:10px; background:#0a66ff; color:#fff; font-size:16px; cursor:pointer; }
    /* Hide model-viewer cards on iOS; show iOS-safe cards instead */
    .card.mv { display:block; }
    .card.iosonly { display:none; }
    .ios .card.mv { display:none; }
    .ios .card.iosonly { display:block; }
  </style>
</head>
<body>
  <h1>Tap a model to view in AR</h1>

  <div class="grid">
    <!-- iOS-safe cards: plain rel="ar" links (USDZ) -->
    <div class="card iosonly">
      <img class="poster" src="ICONS/BMD3_A.webp" alt="BMD 3 Preview" />
      <div class="title">BMD 3</div>
      <a class="arbtn" rel="ar" href="bmd3.usdz">View BMD 3 in AR (iOS)</a>
    </div>

    <div class="card iosonly">
      <img class="poster" src="ICONS/BMD5_A.webp" alt="BMD 5 Preview" />
      <div class="title">BMD 5</div>
      <a class="arbtn" rel="ar" href="bmd5.usdz">View BMD 5 in AR (iOS)</a>
    </div>

    <div class="card iosonly">
      <img class="poster" src="ICONS/REBMD_A.webp" alt="reBMD Preview" />
      <div class="title">reBMD</div>
      <a class="arbtn" rel="ar" href="rebmd.usdz">View reBMD in AR (iOS)</a>
    </div>

    <!-- Non-iOS model-viewer cards: GLB preview + AR button -->
    <div class="card mv">
      <div class="title">BMD 3</div>
      <model-viewer
        src="bmd3.glb"
        ios-src="bmd3.usdz"
        alt="BMD 3 Presetting Machine"
        ar
        ar-modes="webxr scene-viewer quick-look"
        camera-controls
        auto-rotate
        poster="ICONS/BMD3_A.webp">
        <button class="arbtn" slot="ar-button">View BMD 3 in AR</button>
      </model-viewer>
    </div>

    <div class="card mv">
      <div class="title">BMD 5</div>
      <model-viewer
        src="bmd5.glb"
        ios-src="bmd5.usdz"
        alt="BMD 5 Presetting Machine"
        ar
        ar-modes="webxr scene-viewer quick-look"
        camera-controls
        auto-rotate
        poster="ICONS/BMD5_A.webp">
        <button class="arbtn" slot="ar-button">View BMD 5 in AR</button>
      </model-viewer>
    </div>

    <div class="card mv">
      <div class="title">reBMD</div>
      <model-viewer
        src="rebmd.glb"
        ios-src="rebmd.usdz"
        alt="reBMD Presetting Machine"
        ar
        ar-modes="webxr scene-viewer quick-look"
        camera-controls
        auto-rotate
        poster="ICONS/REBMD_A.webp">
        <button class="arbtn" slot="ar-button">View reBMD in AR</button>
      </model-viewer>
    </div>
  </div>
</body>
</html>
