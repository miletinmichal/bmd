<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>reBMD – 3D Viewer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script type="module" src="https://unpkg.com/@google/model-viewer@3.4.0/dist/model-viewer.min.js"></script>
  <style>
    body {
      margin: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      background: #fafafa;
    }
    .backbtn {
      display: inline-block;
      margin: 12px;
      padding: 8px 16px;
      font-size: 1rem;
      font-weight: 500;
      color: #0a66ff;
      background: #eef3ff;
      border-radius: 8px;
      text-decoration: none;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
      transition: background 0.2s;
      align-self: flex-start;
    }
    .backbtn:hover {
      background: #dbe8ff;
    }
    model-viewer {
      flex: 1;
      width: 100%;
      background: #fff;
    }
  </style>
</head>
<body>
  <a href="index.html" class="backbtn">← Back </a>
  <model-viewer
    src="rebmd.glb"
    alt="reBMD Presetting Machine"
    camera-controls
    auto-rotate
    poster="ICONS/REBMD_A.webp">
  </model-viewer>
</body>
</html>
