<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>reBMD – 3D Viewer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script type="module" src="https://unpkg.com/@google/model-viewer@3.4.0/dist/model-viewer.min.js"></script>
  <style>
    body { margin:0; display:grid; place-items:center; height:100vh; background:#fafafa }

  <model-viewer src="rebmd.glb" alt="reBMD"

</body>
</html>
